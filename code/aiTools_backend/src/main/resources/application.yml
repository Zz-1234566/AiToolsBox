server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: aiTools_backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: dr
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT
jwt:
  secret: ${JWT_SECRET:default-dev-secret-key-change-in-production-please-2024}
  expiration: 604800000  # 7 days in milliseconds

# 文件存储
file:
  upload-dir: uploads
