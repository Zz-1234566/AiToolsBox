server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: aiTools_backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: dr
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT
# jwt.secret 必须通过环境变量 JWT_SECRET 设置（≥32 字节随机字符串）。
# 未设置时启动直接失败（Spring 占位符 unresolved + JwtUtil 启动校验双重保险）。
# 示例：JWT_SECRET=$(openssl rand -base64 32)
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000  # 7 days in milliseconds

# 文件存储
file:
  upload-dir: uploads
