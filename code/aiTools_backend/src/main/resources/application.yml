server:
  port: 8080
  tomcat:
    # 被拒绝的上传请求，Tomcat 仍需把已收到的请求体读完，
    # 否则连接会被直接重置（客户端看到 connection reset 而不是明确的 400）。
    # 默认 maxSwallowSize 只有 2MB，200MB 的请求被拒时必然重置连接。
    max-swallow-size: 200MB

spring:
  profiles:
    active: dev
  application:
    name: aiTools_backend
  servlet:
    multipart:
      # 单文件上限 20MB（与 Constants.MAX_FILE_SIZE 保持一致）
      max-file-size: 20MB
      # 整个上传请求的上限 200MB（批量 10 个文件 × 20MB）
      # ⚠️ 必须与 Constants.BATCH_MAX_TOTAL_SIZE 和前端 tools.js 的 fileRule.maxTotalSize 一致，
      #    三处任一小于实际值，用户就会遇到「前端放行、后端拒收」。
      # ⚠️ 内存安全靠的是「文件流式落盘 + 逐个文件读进内存处理」，
      #    不是靠这个上限 —— 并发请求数才是堆占用的决定因素。
      #    上传峰值堆 = 并发批量数 × 单文件大小（20MB），与总大小上限无关。
      max-request-size: 200MB

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: dr
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT
# jwt.secret 必须通过环境变量 JWT_SECRET 设置（≥32 字节随机字符串）。
# 未设置时启动直接失败（Spring 占位符 unresolved + JwtUtil 启动校验双重保险）。
# 示例：JWT_SECRET=$(openssl rand -base64 32)
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000  # 7 days in milliseconds

# 文件存储
file:
  upload-dir: uploads

# 人像分割（image-bg-remover）
segmentation:
  enabled: true
  # 预处理方式：
  #   keep-ratio-pad —— **MODNet 官方口径**（默认）：保持长宽比缩放（长边→input-size）
  #                     + pad 成方形（pad 值 = 127 中灰）。官方 src/models/modnet.py#preprocess
  #                     就是这么做的。squash 会把竖版人像压扁，模型看到的是变形的人。
  #   squash         —— 直接 resize 成 input-size×input-size（旧行为，留作 A/B 回退开关）
  # 模型只接受方形输入（非方形会在内部 Concat 节点维度不匹配报错），所以保持比例必须靠 pad。
  preprocess-mode: keep-ratio-pad
  input-size: 512
  # 蒙版二值化阈值（0~1）。**0 = 不二值化**（MODNet 官方推荐，保留半透明）；
  # 调小更激进（带出更多背景），调大更保守（边缘收缩）。
  mask-threshold: 0
  # 蒙版羽化半径（像素）。**0 = 不羽化**（MODNet 输出本身已连续，羽化反而模糊发丝）
  feather-size: 0
  # 小图先放大到该最小边长再送模型（保留发丝级细节）
  min-input-size: 640

# 批量任务僵尸恢复（BatchTaskRecoveryJob）
# 进程崩溃 / OOM 后，批量任务会永远停在 PENDING / RUNNING —— 数据库里没有「已死」状态，
# 只有「没人再碰它了」。本组配置定义「多久没人碰 = 判定为僵死」。
batch:
  # 同时处理的重任务数上限（= 批量线程池的 maxPoolSize）。
  # 按 2GB 堆算出来的：单任务峰值 83.7MB × 8 = 670MB（占堆 32.7%）。
  # 换堆大小后重算：并发 = (堆 - 预留800MB) / 单任务峰值 / 2
  # 详见 config/ExecutorConfig.batchMaxConcurrentTasks 的注释。
  max-concurrent-tasks: 8
  # 批量任务队列深度。排队中的任务各自占着已落盘的上传文件（最坏 200MB/个），
  # 20 → 最坏约 4GB 临时磁盘占用。部署机磁盘更大 / IO 更快时可调大。
  task-queue-capacity: 20
  recovery:
    # RUNNING 超时阈值（分钟）：任务确实在跑，阈值要大于单批最长处理时间
    running-timeout-minutes: 30
    # PENDING 超时阈值（分钟）：还在线程池排队，阈值要比 RUNNING 宽松
    pending-timeout-minutes: 60
    # 扫描间隔（毫秒）：5 分钟
    scan-interval-ms: 300000
    # 启动后首次扫描的延迟（毫秒）：1 分钟（避开启动高峰）
    initial-delay-ms: 60000
    # 批量临时文件的保留时长（分钟）：120（兜底清理「进程被 kill」留下的残留）
    temp-file-retention-minutes: 120
